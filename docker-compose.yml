services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ustvari .env po vzoru .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?Ustvari .env po vzoru .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustvari .env po vzoru .env.example}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pijacai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
      JWT_SECRET: ${JWT_SECRET:?Dodaj JWT_SECRET v .env po vzoru .env.example}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8001}/api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pijacai-db:
